name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Local gate
        run: make gate
      - name: Smoke run
        run: uv run parhaf-clinbench smoke --suite configs/suites/v1_smoke.yaml --output-dir results/smoke
