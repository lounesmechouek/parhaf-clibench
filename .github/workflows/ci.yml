name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Local gate
        run: make gate
      - name: Smoke run
        run: uv run parhaf-clinbench smoke --suite configs/suites/v1_smoke.yaml --output-dir results/smoke