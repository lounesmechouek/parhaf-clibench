name: docker-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      image_ref: ${{ steps.image-meta.outputs.image_ref }}
      image_repo: ${{ steps.image-meta.outputs.image_repo }}
      immutable_tag: ${{ steps.image-meta.outputs.immutable_tag }}

    steps:
      - name: Free disk space before build
        run: |
          set -euo pipefail
          echo "=== Disk usage BEFORE cleanup ==="
          df -h
          docker system df || true

          # ── Swap: repurpose the ~4 GB swap file as usable disk space ──────────
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true

          # ── Tool cache: Node, Python, Go, Ruby … (~8-10 GB) ──────────────────
          # We never call setup-node/setup-python/etc. in this workflow.
          sudo rm -rf /opt/hostedtoolcache || true

          # ── Language runtimes we don't use (~6 GB) ───────────────────────────
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/lib/android || true

          # ── Large pre-installed APT packages (~3-4 GB) ───────────────────────
          sudo apt-get remove -y --purge \
            '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            google-chrome-stable firefox powershell \
            2>/dev/null || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          # ── Pre-pulled Docker images and build cache on the runner ───────────
          docker system prune --all --force || true
          docker builder prune --all --force || true

          echo "=== Disk usage AFTER cleanup ==="
          df -h
          docker system df || true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image metadata
        id: image-meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_REPO: ${{ vars.DOCKER_IMAGE_REPO }}
        run: |
          set -euo pipefail

          if [ -n "${DOCKER_IMAGE_REPO:-}" ]; then
            image_repo="${DOCKER_IMAGE_REPO}"
          else
            if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
              echo "Missing DOCKERHUB_USERNAME secret (or set vars.DOCKER_IMAGE_REPO)." >&2
              exit 1
            fi
            image_repo="${DOCKERHUB_USERNAME}/parhaf-clinbench-vllm"
          fi

          immutable_tag="sha-${GITHUB_SHA::12}"
          image_ref="${image_repo}:${immutable_tag}"

          {
            echo "image_repo=${image_repo}"
            echo "immutable_tag=${immutable_tag}"
            echo "image_ref=${image_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "Missing required secret: DOCKERHUB_USERNAME" >&2
            exit 1
          fi

          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Missing required secret: DOCKERHUB_TOKEN" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.vllm
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image-meta.outputs.image_ref }}
            ${{ steps.image-meta.outputs.image_repo }}:main
          cache-from: type=registry,ref=${{ steps.image-meta.outputs.image_repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.image-meta.outputs.image_repo }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Disk usage after build (on failure)
        if: failure()
        run: |
          set -euo pipefail
          docker system df || true
          df -h

      - name: Build summary
        run: |
          {
            echo "### Docker image published"
            echo "- Immutable tag: \`${{ steps.image-meta.outputs.image_ref }}\`"
            echo "- Rolling tag: \`${{ steps.image-meta.outputs.image_repo }}:main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
