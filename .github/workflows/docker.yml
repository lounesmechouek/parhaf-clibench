name: docker-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.image-meta.outputs.image_ref }}
      image_repo: ${{ steps.image-meta.outputs.image_repo }}
      immutable_tag: ${{ steps.image-meta.outputs.immutable_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image metadata
        id: image-meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE_REPO: ${{ vars.DOCKER_IMAGE_REPO }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_IMAGE_REPO}" ]; then
            image_repo="${DOCKER_IMAGE_REPO}"
          else
            if [ -z "${DOCKERHUB_USERNAME}" ]; then
              echo "Missing DOCKERHUB_USERNAME secret (or set vars.DOCKER_IMAGE_REPO)." >&2
              exit 1
            fi
            image_repo="${DOCKERHUB_USERNAME}/parhaf-clinbench-vllm"
          fi
          immutable_tag="sha-${GITHUB_SHA::12}"
          image_ref="${image_repo}:${immutable_tag}"
          {
            echo "image_repo=${image_repo}"
            echo "immutable_tag=${immutable_tag}"
            echo "image_ref=${image_ref}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.vllm
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image_ref }}
            ${{ steps.image-meta.outputs.image_repo }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          {
            echo "### Docker image published"
            echo "- Immutable tag: \`${{ steps.image-meta.outputs.image_ref }}\`"
            echo "- Rolling tag: \`${{ steps.image-meta.outputs.image_repo }}:main\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  update-runpod-template:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.RUNPOD_API_KEY != '' && vars.RUNPOD_TEMPLATE_ID != '' }}
    steps:
      - name: Update RunPod template image tag
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
          RUNPOD_API_BASE: ${{ vars.RUNPOD_API_BASE }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: |
          set -euo pipefail
          api_base="${RUNPOD_API_BASE:-https://rest.runpod.io/v1}"
          templates_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
            "${api_base}/templates")"
          payload="$(TEMPLATES_JSON="${templates_json}" python - <<'PY'
          import json
          import os
          import sys

          template_id = os.environ["RUNPOD_TEMPLATE_ID"]
          image_ref = os.environ["IMAGE_REF"]
          templates = json.loads(os.environ["TEMPLATES_JSON"])

          template = None
          for item in templates:
              if str(item.get("id")) == template_id:
                  template = item
                  break
          if template is None:
              raise SystemExit(f"Template not found in /templates response: {template_id}")

          payload = {
              "name": template["name"],
              "imageName": image_ref,
          }
          for key in (
              "containerDiskInGb",
              "containerRegistryAuthId",
              "dockerEntrypoint",
              "dockerStartCmd",
              "env",
              "isPublic",
              "ports",
              "readme",
              "volumeInGb",
              "volumeMountPath",
          ):
              value = template.get(key)
              if value is not None:
                  payload[key] = value

          sys.stdout.write(json.dumps(payload))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --url "${api_base}/templates/${RUNPOD_TEMPLATE_ID}/update" \
            --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "${payload}" > /tmp/runpod_template_update.json
          echo "Updated template ${RUNPOD_TEMPLATE_ID} -> ${IMAGE_REF}"
          echo "response=$(cat /tmp/runpod_template_update.json)"
