[project]
name = "parhaf-clinbench"
version = "0.1.0"
description = "Reproducible benchmark for French clinical information extraction on PARHAF dataset"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lounes Mechouek"}]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "requests>=2.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "accelerate>=1.0",
  "gliner2>=0.3.1",
  "huggingface-hub>=0.24",
  "datasets>=2.21",
  "streamlit>=1.39",
  "streamlit-extras>=0.4",
  "streamlit-option-menu>=0.3.12",
  "plotly>=5.24",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=4.5.1",
  "pandas-stubs>=2.2.3.250308",
  "rich>=13.0",
  "types-PyYAML>=6.0.12.20240917",
  "types-requests>=2.32.0.20250328",
]
locale = [
  "vllm>=0.8.5",
]
monitoring = [
  "rich>=13.0",
]


[project.scripts]
parhaf-clinbench = "parhaf_clinbench.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parhaf_clinbench"]

[tool.uv]
exclude-newer = "2026-03-21T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["parhaf_clinbench", "ui", "monitoring"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings --cov=parhaf_clinbench --cov=ui --cov=monitoring --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src", "tests", "ui", "monitoring"]

[[tool.mypy.overrides]]
module = [
  "pandas",
  "plotly",
  "plotly.*",
  "pyarrow",
  "rich",
  "rich.*",
  "streamlit",
  "streamlit.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["parhaf_clinbench", "ui", "monitoring"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
