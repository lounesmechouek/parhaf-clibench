[project]
name = "parhaf-clinbench"
version = "0.1.0"
description = "Reproducible benchmark for French clinical information extraction on PARHAF dataset"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lounes Mechouek"}]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "requests>=2.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "accelerate>=1.0",
  "gliner2>=0.3.1",
  "huggingface-hub>=0.24",
  "datasets>=2.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=4.5.1",
  "types-PyYAML>=6.0.12.20240917",
  "types-requests>=2.32.0.20250328",
]
locale = [
  "vllm>=0.8.5",
]

[project.scripts]
parhaf-clinbench = "parhaf_clinbench.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parhaf_clinbench"]

[tool.uv]
exclude-newer = "2026-03-21T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["parhaf_clinbench"]
branch = true
